name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: speedtest-rli-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: speedtest-rli-windows-x86_64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: speedtest-rli-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/speedtest ${{ matrix.asset }}

      - name: Rename binary (windows)
        if: matrix.os == 'windows-latest'
        run: copy target\${{ matrix.target }}\release\speedtest.exe ${{ matrix.asset }}

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true

  installers:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Upload installer scripts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            install.sh
            install.ps1
